<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#2b2235" />
<title>Sweet Rush</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff7d9c'/%3E%3Cpath d='M12 40 Q32 8 52 40 Q42 30 32 32 Q22 30 12 40Z' fill='%23f0a841' stroke='%237a2235' stroke-width='3'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;height:100%;background:#2b2235;overflow:hidden}
  #loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#2b2235;color:#fff6e6;font:800 20px/1.2 "Nunito",ui-rounded,system-ui,sans-serif;z-index:99;transition:opacity .5s}
  #loader b{font:700 56px/1 "Fredoka","Nunito",ui-rounded,system-ui,sans-serif;color:#ff7d9c}
  #loader i{width:46px;height:46px;border-radius:50%;border:6px solid #4a3d5c;border-top-color:#ffc93c;animation:sp 0.8s linear infinite}
  #loader.done{opacity:0;pointer-events:none}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loader"><b>Sweet Rush</b><i></i><span>Разогреваем духовки…</span></div>
<div id="app"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
